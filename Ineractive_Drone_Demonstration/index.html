<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone Flight Planner - Minimal POC</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #cesiumContainer { width: 100%; height: 100%; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; z-index: 10; width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
        button:hover { background: #0056b3; }
        .info { font-size: 12px; color: #555; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="ui">
        <h3>Drone Planner POC</h3>
        <p class="info">1. Left-click anywhere on the globe to set a target.</p>
        <button onclick="generatePath()">Generate Flight Path</button>
        <p id="coords" class="info">Target: None selected</p>
    </div>

    <script>
        // Use standard open imagery to prevent blank screen token blocks
        Cesium.Ion.defaultAccessToken = ''; 
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: new Cesium.OpenStreetMapImageryProvider({
                url: 'https://a.tile.openstreetmap.org/'
            }),
            baseLayerPicker: false,
            geocoder: false
        });

        let targetPosition = null;
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        // Click handler to select target point
        handler.setInputAction(function(movement) {
            const cartesian = viewer.scene.camera.pickEllipsoid(movement.position, viewer.scene.globe.ellipsoid);
            if (cartesian) {
                targetPosition = cartesian;
                const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                const lat = Cesium.Math.toDegrees(cartographic.latitude).toFixed(4);
                const lon = Cesium.Math.toDegrees(cartographic.longitude).toFixed(4);
                
                document.getElementById('coords').innerText = `Target: Lat ${lat}, Lon ${lon}`;
                
                viewer.entities.removeAll();
                viewer.entities.add({
                    position: cartesian,
                    point: { pixelSize: 12, color: Cesium.Color.RED }
                });
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        function generatePath() {
            if (!targetPosition) {
                alert('Please click on the globe first to select a target!');
                return;
            }

            const centerCartographic = Cesium.Cartographic.fromCartesian(targetPosition);
            const numPoints = 8;
            const radius = 0.002; // Roughly 200m offset scale
            const waypoints = [];

            // Generate circular geometry trajectory around target
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const lat = centerCartographic.latitude + radius * Math.cos(angle);
                const lon = centerCartographic.longitude + radius * Math.sin(angle);
                const height = centerCartographic.height + 100; // 100m above target altitude

                const wpCartesian = Cesium.Cartesian3.fromRadians(lon, lat, height);
                waypoints.push(wpCartesian);

                // Draw waypoint node
                viewer.entities.add({
                    position: wpCartesian,
                    point: { pixelSize: 8, color: Cesium.Color.YELLOW }
                });

                // Draw camera viewing vector pointing back to target
                viewer.entities.add({
                    polyline: {
                        positions: [wpCartesian, targetPosition],
                        width: 1,
                        material: Cesium.Color.CYAN.withAlpha(0.6)
                    }
                });
            }

            // Close the loop for path line
            waypoints.push(waypoints[0]);
            viewer.entities.add({
                polyline: {
                    positions: waypoints,
                    width: 3,
                    material: Cesium.Color.LIME
                }
            });

            viewer.flyTo(viewer.entities);
        }
    </script>
</body>
</html>
